<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nam Du 20–24/11/2026</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F9FF;--card:#fff;--ink:#12355B;--mute:#587390;--line:#D3E6F5;--sea:#1E7FD8;--coral:#FF8A3D;--sun:#FFD23F;--eat:#E8590C;--see:#0F9F85;--fix:#12355B;--fixt:#fff;--chip:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08172B;--card:#0F2540;--ink:#EAF4F7;--mute:#8CA6B8;--line:#1C3A5A;--sea:#38C9D6;--eat:#FF8A76;--see:#4FD3E0;--fix:#FFB93B;--fixt:#08172B;--chip:#0F2540}}
:root[data-theme="dark"]{--bg:#08172B;--card:#0F2540;--ink:#EAF4F7;--mute:#8CA6B8;--line:#1C3A5A;--sea:#38C9D6;--eat:#FF8A76;--see:#4FD3E0;--fix:#FFB93B;--fixt:#08172B;--chip:#0F2540}
*{box-sizing:border-box}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Nunito",system-ui,sans-serif}
.wrap{max-width:700px;margin:0 auto;padding:0 16px}
.hero{position:relative;overflow:hidden;color:#12355B;background:linear-gradient(180deg,#7CCBFF 0%,#CDEEFF 100%);padding:48px 0 110px}
.sun{position:absolute;right:8%;bottom:70px;width:110px;height:110px;border-radius:50%;background:#FFD23F;box-shadow:0 0 60px 24px rgba(255,210,63,.6)}
.hero .wrap{position:relative;z-index:2}
h1,.head h2,.tt,.pack h3{font-family:"Baloo 2","Nunito",system-ui,sans-serif}
h1{font-size:clamp(44px,13vw,84px);line-height:1;font-weight:800;letter-spacing:-.01em;margin:0 0 12px}
.hero p{margin:0;max-width:34ch;color:#1B4B7A;font-size:18px;font-weight:600}
.cd{display:inline-flex;gap:14px;margin-top:24px;background:#fff;color:#12355B;box-shadow:0 6px 18px rgba(18,53,91,.15);border-radius:18px;padding:12px 18px;align-items:center}
.cd b{font-size:26px;font-weight:800;line-height:1}
.cd small{display:block;font-size:12px;color:#587390}
.cd .u{text-align:center}
.cd .lbl{font-size:13px;font-weight:700;color:#E8590C;max-width:11ch;line-height:1.3}
.waves{position:absolute;left:0;right:0;bottom:-1px;height:90px;z-index:3}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.w1{animation:sl 14s linear infinite}.w2{animation:sl 9s linear infinite reverse;opacity:.7}
@keyframes sl{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.w1,.w2{animation:none}}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:1 0 auto;min-width:62px;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;padding:6px 10px;font:700 18px/1.1 "Baloo 2",system-ui,sans-serif;cursor:pointer;transition:transform .15s}
.tabs button small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs button.on small{color:var(--sun)}
.tabs button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.fl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fl button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:4px 14px;font:700 13.5px "Nunito",system-ui,sans-serif;cursor:pointer}
.fl button.on{background:var(--sea);border-color:var(--sea);color:#fff}
.prog{height:6px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--sun));transition:width .4s}
.head{margin:26px 0 18px}
.head h2{font-size:clamp(26px,7vw,36px);line-height:1.1;font-weight:900;letter-spacing:-.02em;margin:0}
.head p{margin:6px 0 0;color:var(--mute)}
.tl{position:relative;margin:0;padding:0 0 10px 30px;list-style:none}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:10px;width:3px;background:var(--line);border-radius:3px}
.it{position:relative;margin-bottom:12px}
.it .dot{position:absolute;left:-30px;top:16px;width:21px;height:21px;border-radius:50%;background:var(--card);border:4px solid var(--c,var(--line));transition:.2s}
.it.fix{--c:var(--fix)}.it.eat{--c:var(--eat)}.it.see{--c:var(--see)}
.it button{all:unset;display:block;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.it button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.it.fix button{border-left:5px solid var(--fix)}
.it.eat button{border-left:5px solid var(--eat)}
.it.see button{border-left:5px solid var(--see)}
.tm{font-weight:800;font-size:14px;color:var(--mute)}
.it.fix .tm{color:var(--fixt);background:var(--fix);display:inline-block;padding:0 9px;border-radius:7px}
.tt{font-weight:700;font-size:17px;line-height:1.3;margin-top:2px}
.nt{color:var(--mute);font-size:14px;margin-top:2px}
.tg{font-size:12.5px;font-weight:700;margin-left:6px}
.eat .tg{color:var(--eat)}.see .tg{color:var(--see)}
.it.done .dot{background:var(--sea);border-color:var(--sea)}
.it.done .dot::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:12px;font-weight:900;text-align:center;line-height:13px}
.it.done .tt,.it.done .nt{text-decoration:line-through;opacity:.55}
.it.done button{opacity:.8}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.pack{margin:26px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.pack h3{margin:0 0 8px;font-size:20px;font-weight:800}
.pack label{display:flex;gap:10px;padding:6px 0;cursor:pointer}
.pack input{width:20px;height:20px;accent-color:var(--coral);flex:0 0 auto;margin-top:2px}
.pack input:checked+span{text-decoration:line-through;opacity:.5}
footer{text-align:center;color:var(--mute);font-size:13px;padding:6px 16px 36px}
</style>
</head>
<body>
<header class="hero">
<div class="sun"></div>
<div class="wrap">
<h1>Nam Du<br>20–24/11</h1>
<p>Ngủ xe, đi tàu, tắm biển, ăn hải sản và ngắm sao.</p>
<div class="cd" id="cd" aria-live="polite"></div>
</div>
<div class="waves" aria-hidden="true">
<svg class="w2" viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#4FB3F5" d="M0 40C100 10 200 70 300 40S500 10 600 40s200 30 300 0 200-30 300 0V90H0z"/></svg>
<svg class="w1" viewBox="0 0 1200 90" preserveAspectRatio="none"><path style="fill:var(--bg)" d="M0 55C100 30 200 80 300 55S500 30 600 55s200 25 300 0 200-25 300 0V90H0z"/></svg>
</div>
</header>
<div class="bar"><div class="wrap">
<div class="tabs" id="tabs" role="tablist"></div>
<div class="fl" id="fl"></div>
<div class="prog" aria-hidden="true"><i id="pr"></i></div>
</div></div>
<main class="wrap">
<div class="head"><h2 id="ht"></h2><p id="hs"></p></div>
<p class="hint">Chạm vào một mục để đánh dấu đã xong.</p>
<ul class="tl" id="tl"></ul>
<div class="pack"><h3>Mang theo</h3><div id="pk"></div></div>
</main>
<footer>Giờ tàu xe vui lòng đối chiếu lại với vé thật.</footer>
<script>
var D=[
{d:"20",w:"Thứ Sáu",h:"TP.HCM → Rạch Giá",s:"Chuẩn bị đồ, tối ra bến xe Miền Tây",i:[
["Ban ngày","Chuẩn bị đồ và đóng gói hành lý","","",""],
["22:45","Có mặt ở bến xe Miền Tây","","",""],
["23:45","Xe Phương Trang xuất phát","Ngủ trên xe, mai tới Rạch Giá","fix",""]]},
{d:"21",w:"Thứ Bảy",h:"Rạch Giá → Nam Du",s:"Ra đảo, nhận phòng, ăn và ngắm hoàng hôn",i:[
["Sáng sớm","Xe đến Rạch Giá, ăn sáng gần bến tàu","","",""],
["7:30","Tàu Rạch Giá → Nam Du","","fix",""],
["~10:30","Đến đảo, nhận phòng Nam Du Palace","Nghỉ ngơi một chút","",""],
["Trưa","Quán cơm Biểu Thiện","","eat","Ăn trưa"],
["Chiều","Bánh căn, bánh xèo","Cạnh nhà nghỉ Huỳnh Đào","eat","Ăn chiều"],
["Chiều","Đá me","Ở chợ","eat","Ăn vặt"],
["Chiều","Dốc làng chài","Cạnh khách sạn Khang Vy, chụp ảnh","see","Check-in"],
["~17:15","Ngắm hoàng hôn ở Làng Chài","","see","Hoàng hôn"],
["Tối","Quán Hiền Hậu","","eat","Ăn tối"],
["Khuya","Ngắm sao đối diện cột cờ Nam Du","Nếu trời quang. Mang đèn pin","see","Ngắm sao"]]},
{d:"22",w:"Chủ Nhật",h:"Tour đảo",s:"Khung giờ bắt buộc 7:30–17:00",i:[
["5:30","Ngắm bình minh ở cầu cảng homestay Phong Vũ cũ","Gần, về kịp ăn sáng trước tour","see","Bình minh"],
["7:30","Bắt đầu tour đảo","Ăn trưa trên tour. Mang đồ bơi, kem chống nắng","fix",""],
["17:00","Kết thúc tour, về khách sạn","","fix",""],
["Chiều tối","Thịt nướng Nam Du","Kế bên khách sạn Khang Vy","eat","Ăn chiều"],
["Tối","Quán Nhựt Mập","Mua đặc sản làm quà","eat","Ăn tối"],
["Dự phòng","Ngắm sao bù nếu đêm trước nhiều mây","","see","Ngắm sao"]]},
{d:"23",w:"Thứ Hai",h:"Nam Du → Rạch Giá → An Biên",s:"Bình minh Bãi Mến, rồi về đất liền",i:[
["~5:30","Ngắm bình minh ở Bãi Mến","Hỏi trước cách di chuyển để kịp tàu","see","Bình minh"],
["Sáng","Ăn sáng, trả phòng","","",""],
["11:00","Lên tàu Superdong về Rạch Giá","","fix",""],
["~13:30","Đến Rạch Giá, ăn trưa","","",""],
["Chiều","Di chuyển về An Biên","Khoảng 1 tiếng","",""],
["Tối","Hoạt động tự do, ăn tối, nghỉ đêm","","",""]]},
{d:"24",w:"Thứ Ba",h:"An Biên → TP.HCM",s:"Kết thúc chuyến đi",i:[
["Sáng","Ăn sáng, ra điểm lên xe","","",""],
["8:30","Xe về Sài Gòn","","fix",""]]}
];
var P=["Kem chống nắng","Áo mưa mỏng","Thuốc say sóng","Sạc dự phòng","Đồ bơi","Đèn pin hoặc đèn đầu","Giấy tờ tùy thân, vé xe, vé tàu","Tiền mặt"];
var F=[["all","Tất cả"],["fix","Giờ cố định"],["eat","Ăn uống"],["see","Ngắm cảnh"]];
var cur=0,flt="all",done={};
try{done=JSON.parse(localStorage.getItem("nd26")||"{}")}catch(e){}
function save(){try{localStorage.setItem("nd26",JSON.stringify(done))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function tabs(){$("tabs").innerHTML=D.map(function(x,k){return '<button role="tab" aria-selected="'+(k==cur)+'" class="'+(k==cur?"on":"")+'" data-k="'+k+'">'+x.d+'/11<small>'+x.w+'</small></button>'}).join("")}
function fl(){$("fl").innerHTML=F.map(function(f){return '<button class="'+(f[0]==flt?"on":"")+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join("")}
function show(){
var x=D[cur];$("ht").textContent=x.h;$("hs").textContent=x.w+" "+x.d+"/11 · "+x.s;
var h="";
x.i.forEach(function(a,j){
if(flt!="all"&&a[3]!=flt)return;
var id=cur+"-"+j;
h+='<li class="it '+a[3]+(done[id]?" done":"")+'"><span class="dot"></span><button data-id="'+id+'" aria-pressed="'+!!done[id]+'"><span class="tm">'+a[0]+'</span><span class="tg">'+a[4]+'</span><div class="tt">'+a[1]+'</div>'+(a[2]?'<div class="nt">'+a[2]+'</div>':'')+'</button></li>';
});
$("tl").innerHTML=h||'<li class="nt">Ngày này không có mục nào thuộc nhóm đã chọn.</li>';
var n=0,t=0;D.forEach(function(d,k){d.i.forEach(function(_,j){t++;if(done[k+"-"+j])n++})});
$("pr").style.width=(n/t*100)+"%";
}
$("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;cur=+b.dataset.k;tabs();show();window.scrollTo({top:0})};
$("fl").onclick=function(e){var b=e.target.closest("button");if(!b)return;flt=b.dataset.f;fl();show()};
$("tl").onclick=function(e){var b=e.target.closest("button");if(!b)return;var id=b.dataset.id;if(done[id])delete done[id];else done[id]=1;save();show()};
var pk={};try{pk=JSON.parse(localStorage.getItem("nd26p")||"{}")}catch(e){}
$("pk").innerHTML=P.map(function(p,i){return '<label><input type="checkbox" data-i="'+i+'"'+(pk[i]?" checked":"")+'><span>'+p+'</span></label>'}).join("");
$("pk").onchange=function(e){pk[e.target.dataset.i]=e.target.checked;try{localStorage.setItem("nd26p",JSON.stringify(pk))}catch(x){}};
function cd(){
var t=new Date("2026-11-20T23:45:00+07:00")-new Date(),e=new Date("2026-11-24T08:30:00+07:00")-new Date(),c=$("cd");
if(e<0){c.innerHTML='<span class="lbl">Chuyến đi đã kết thúc</span>';return}
if(t<=0){c.innerHTML='<span class="lbl">Chuyến đi đang diễn ra</span>';return}
var d=Math.floor(t/864e5),h=Math.floor(t%864e5/36e5),m=Math.floor(t%36e5/6e4);
c.innerHTML='<div class="u"><b>'+d+'</b><small>ngày</small></div><div class="u"><b>'+h+'</b><small>giờ</small></div><div class="u"><b>'+m+'</b><small>phút</small></div><span class="lbl">đến giờ xe chạy</span>';
}
cd();setInterval(cd,30000);
(function(){var n=new Date(),s=new Date("2026-11-20T00:00:00+07:00"),k=Math.floor((n-s)/864e5);if(k>=0&&k<5)cur=k})();
tabs();fl();show();
</script>
</body>
</html>
